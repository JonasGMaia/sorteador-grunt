<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="@@ENDEREÇO_DO_CSS">
</head>
<body>
    <main>
        <h1>Sorteio Online</h1>
        <form id="formSorteador">
            <div class="numero-maximo">
                <label for="numero-maximo">Número Máximo :</label>
                <input type="number" name="numero-maximo" id="numero-maximo" required min="2" value="2" step="1">
            </div>
            <button type="submit">Sortear Número</button>
        </form>
        <div class="resultado">
            o numero sorteado foi: <span id="resultadoValor"></span>
        </div>
    </main>
    

    <script src="@@ENDEREÇO_DO_JS"></script>

</body>
</html>
